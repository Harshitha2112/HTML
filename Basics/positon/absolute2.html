<!--here we placing positon absolute inside a position fixedsothat the top ,left,right etc are relative to fixed position-->
<!DOCTYPE html>
<html lang="en">
<head>
         
          <title>SIDEBAR PRACTICE</title>
          <style>
             
                    .header{
                              background-color: greenyellow;
                              height: 50px;
                              position: fixed;
                              top: 0;
                              left: 0;
                              right: 0px;
                    }
                    .sidebar{
                              position: fixed;
                              left:0;
                              bottom: 0;
                              top: 50px;
                              background-color: palevioletred;
                              width: 72px;
                    }
                    .absolute{
                              background-color: aqua;
                            
                              position: absolute;
                              left: 10px; /* i.e, left from sidebar*/
                              top: 50px;
                     }/* top from sidebar reference*/
                    
                    
                    .x{
                            background-color: aqua;
                            position: absolute;/*so this is how we attach elements to the corners or the sides of other elements*/
                            right: 0;
                            top: 0;       
                    }
          </style>
</head>
<body style="margin-bottom: 3000px;">
          <div class="header">
                    header
          </div>
          <div style="padding: 1000px;
          background:linear-gradient(40deg,blue,red) ;
          display: flex;
          align-items: center;"> body</div>
          <div class="sidebar">
                    sidebar
                    <div class="absolute">
                              absolute
                    </div>
                    <div class="x"> x</div>
          </div>
          
</body>
</html>
