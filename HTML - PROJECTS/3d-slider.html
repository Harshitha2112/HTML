<!--
          images by default are inline element like text
          if the image is inline or inline block,and its inside a container like <div>,you can use text-align to align it horizontally.
-->

<!DOCTYPE html>
<html lang="en">
<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Document</title>
          <style>
                    *{
                              margin: 0;
                              padding: 0;
                              box-sizing: border-box;
                    }
                    body{
                              background: linear-gradient(to right,#1A2421,#0B6623,#1A2421);
                    }
                    .banner{
                              width: 100%;
                              height: 100vh;/* to takeup full screen*/
                              text-align: center;    /* used to set the horizontal alignment of text inside a block level element like div,p,h1 etc*/
                              overflow: hidden;    /* it hides the image overflowing the screen*/
                              position: relative;
                    }
                    .banner .slider{
                              position: absolute;  /* to easily move within its parent element*/
                              width: 200px;
                              height: 250px;
                              top: 10%;
                              left:calc(50% - 100px) ;
                              transform-style: preserve-3d;
                              transform: perspective(1000px);
                              animation: autorun 20s linear infinite;
                              z-index: 2;
                                 
                    }
                     @keyframes autorun {
                              from{
                                        transform: perspective(1000px) rotatex(-15deg) rotateY(0deg);
                              }
                              to{
                                        transform: perspective(1000px)  rotatex(-15deg) rotateY(360deg);
                              }
                              
                    }
                    .banner .slider .item{
                              position: absolute;
                              inset: 0 0 0 0;
                              transform: 
                                        rotateY(calc((var(--i) - 1) * (360 / var(--quantity)) * 1deg))
                                        translatez(550px);
                             
                    }
                   
                    .banner .slider .item img{
                              width: 100%;
                              height: 100%;
                              object-fit:cover;
                    }
                    .banner .content{
                              position: absolute;
                              bottom:0;
                              left: 50%;
                              transform: translateX(-50%);
                              width: min(1400px, 100vw);
                              height: max-content;
                              padding-bottom: 80px;
                              display: flex;
                              flex-wrap: wrap;
                              align-items: center;
                              justify-content: center;
                              z-index: 1;
                    }
                    .banner .content h1{
                              font-family:'Times New Roman', Times, serif;
                              font-size: 10em;
                              line-height: 1em;
                              color: #252838;
                    }
                    .banner .content h1::after{
                              color: transparent;
                              position: absolute;
                              inset: 0 0 0 0;
                              content: attr(data-content);
                              z-index: 2;
                              -webkit-text-stroke: 2px white;
                    }
                    .banner .content .model{
                           
                              width: 100%;
                              height: 75vh;
                              background-image: url(/thumbnails/attack-titan.jpg);
                              background-blend-mode: multiply;
                              position: absolute;
                              bottom: 0;
                              left:0;
                              background-size: auto 130%;
                              background-repeat: no-repeat;
                              background-position: top center;
                              z-index: 0;
                    }

          </style>
</head>
<body>
         <div class="banner">
                    <div class="slider" style="--quantity:10">
                             
                    <div class="item"style="--i:1"><img src="/thumbnails/AOT-1.jpg" alt=""> </div>
                    <div class="item" style="--i:2"><img src="/thumbnails/AOT-2.jpg" alt=""></div>            
                    <div class="item" style="--i:3"><img src="/thumbnails/AOT-11.jpg" alt=""></div>          
                    <div class="item" style="--i:4"><img src="/thumbnails/AOT-4.jpg" alt=""></div>        
                    <div class="item" style="--i:5"><img src="/thumbnails/AOT-5.jpg" alt=""></div>       
                    <div class="item" style="--i:6"><img src="/thumbnails/AOT-6.jpg" alt=""></div>     
                    <div class="item" style="--i:7"><img src="/thumbnails/AOT-7.jpg" alt=""></div>        
                    <div class="item" style="--i:8"><img src="/thumbnails/AOT-13.jpg" alt=""></div>         
                    <div class="item" style="--i:9"><img src="/thumbnails/AOT-9.jpg" alt=""></div>        
                    <div class="item" style="--i:10"><img src="/thumbnails/AOT-10.jpg"alt=""></div>      
                                       
                              
                    </div>
                    <div class="content">
                              <h1>
                                        Attack On Titan
                              </h1>
                              <div class="model">
                                       
                              </div>
                    </div>
         </div> 
</body>
</html>
