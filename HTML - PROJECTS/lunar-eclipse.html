<!DOCTYPE html>
<html lang="en">
<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Document</title>
          <style>
                    *{
                              padding: 0;
                              margin: 0;
                              box-sizing: border-box;
                    }
                    body{
                              width: 100vw;
                              height: 100vh;
                              display: grid;
                              place-items: center;
                              background: linear-gradient(to left,#83c29f,#0b938c);
                    }
                    .box{
                              width: 30vw;
                              height: 70vh;
                              background: black;
                              border-radius: 30px;
                              position: relative;
                              display: flex;
                              justify-content: center;
                              align-items: center;
                              animation: backcolor 4s linear infinite;
                    }
                    .box div{
                              position: absolute;
                              width: 13vw;
                              aspect-ratio: 1;
                              border-radius: 50%;
                              background: #000;
                            
                              overflow: hidden;
                              &::before{
                                        content: "";
                                        position: absolute;
                                        width: 13vw;
                                        aspect-ratio: 1;
                                        background: crimson;
                                        border-radius: 50%;
                                        animation: moving 4s linear infinite;
                              

                    }
                              
                    }
                    
                    @keyframes moving{
                              0%{
                                        transform: translateX(0);
                              }
                              100%{
                                        transform: translateX(250px);
                                       
                              }
                    }
                    @keyframes backcolor{
                              0%{
                                        background:  #dd5907;
                              }
                              100%{
                                        background :#000;
                              }
                    }
          </style>
</head>
<body>
          <div class="box">
                    <div></div>
          </div>
</body>
</html>
